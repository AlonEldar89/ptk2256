<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>תיחום דירות (פוליגון)</title>
<style>
 body{font-family:Rubik,Arial,sans-serif;margin:16px;background:#fafafa;color:#222}
 h1{font-size:18px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
 #wrap{position:relative;display:inline-block;border:1px solid #ccc;background:#fff}
 #img{display:block;max-width:100%;height:auto;user-select:none}
 svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
 button{font-size:14px;padding:6px 10px;cursor:pointer}
 .hint{color:#666;font-size:13px}
 #list{margin-top:12px;font-family:monospace;font-size:12px;background:#fff;border:1px solid #ddd;padding:10px;border-radius:6px;white-space:pre-wrap;max-height:200px;overflow:auto}
 b{color:#1976d2}
</style></head><body>
<h1>תיחום דירות — לחצו נקודות סביב קו המתאר של הדירה, ואז "שמור"</h1>
<div class="bar">
 <button id="prev">◀ הקודם</button>
 <span>דירה <b id="idx">1</b>/<b id="total"></b>: <b id="label"></b></span>
 <button id="next">הבא ▶</button>
 <button id="undo">↩︎ נקודה אחרונה</button>
 <button id="clear">נקה</button>
 <button id="save">💾 שמור פוליגון</button>
 <button id="copy">📋 העתק הכל</button>
 <span class="hint">לחיצה = נקודה. הקיפו את הדירה. "שמור" עובר לבאה.</span>
</div>
<div id="wrap"><img id="img" draggable="false"><svg id="ov"></svg></div>
<div id="list">אין פוליגונים…</div>
<script>
const APTS = [{"b": "A1", "band": "ground", "code": "A1-E", "path": "images/plans/apts/A1-ground-A1-E.jpg"}, {"b": "A1", "band": "typical-1-7", "code": "B'", "path": "images/plans/apts/A1-typical-1-7-Bp.jpg"}, {"b": "A1", "band": "typical-1-7", "code": "C'", "path": "images/plans/apts/A1-typical-1-7-Cp.jpg"}, {"b": "A1", "band": "typical-1-7", "code": "C", "path": "images/plans/apts/A1-typical-1-7-C.jpg"}, {"b": "A1", "band": "typical-1-7", "code": "B", "path": "images/plans/apts/A1-typical-1-7-B.jpg"}, {"b": "A1", "band": "typical-1-7", "code": "A", "path": "images/plans/apts/A1-typical-1-7-A.jpg"}, {"b": "A1", "band": "floor-8", "code": "A-PA", "path": "images/plans/apts/A1-floor-8-A-PA.jpg"}, {"b": "A1", "band": "floor-8", "code": "A-PB", "path": "images/plans/apts/A1-floor-8-A-PB.jpg"}, {"b": "A1", "band": "floor-9", "code": "A-PC'", "path": "images/plans/apts/A1-floor-9-A-PCp.jpg"}, {"b": "A1", "band": "floor-9", "code": "A-PC", "path": "images/plans/apts/A1-floor-9-A-PC.jpg"}, {"b": "A2", "band": "ground", "code": "A2-E", "path": "images/plans/apts/A2-ground-A2-E.jpg"}, {"b": "A2", "band": "ground", "code": "A2-E'", "path": "images/plans/apts/A2-ground-A2-Ep.jpg"}, {"b": "A2", "band": "typical-1-7", "code": "C'", "path": "images/plans/apts/A2-typical-1-7-Cp.jpg"}, {"b": "A2", "band": "typical-1-7", "code": "C", "path": "images/plans/apts/A2-typical-1-7-C.jpg"}, {"b": "A2", "band": "typical-1-7", "code": "B'", "path": "images/plans/apts/A2-typical-1-7-Bp.jpg"}, {"b": "A2", "band": "typical-1-7", "code": "B", "path": "images/plans/apts/A2-typical-1-7-B.jpg"}, {"b": "A2", "band": "typical-1-7", "code": "A", "path": "images/plans/apts/A2-typical-1-7-A.jpg"}, {"b": "A2", "band": "floor-8", "code": "A-PA", "path": "images/plans/apts/A2-floor-8-A-PA.jpg"}, {"b": "A2", "band": "floor-8", "code": "A-PB", "path": "images/plans/apts/A2-floor-8-A-PB.jpg"}, {"b": "B", "band": "ground", "code": "B-E'", "path": "images/plans/apts/B-ground-B-Ep.jpg"}, {"b": "B", "band": "ground", "code": "B-E", "path": "images/plans/apts/B-ground-B-E.jpg"}, {"b": "B", "band": "typical-1-7", "code": "A", "path": "images/plans/apts/B-typical-1-7-A.jpg"}, {"b": "B", "band": "typical-1-7", "code": "C*", "path": "images/plans/apts/B-typical-1-7-Cs.jpg"}, {"b": "B", "band": "typical-1-7", "code": "C", "path": "images/plans/apts/B-typical-1-7-C.jpg"}, {"b": "B", "band": "typical-1-7", "code": "B", "path": "images/plans/apts/B-typical-1-7-B.jpg"}, {"b": "B", "band": "typical-1-7", "code": "B'", "path": "images/plans/apts/B-typical-1-7-Bp.jpg"}, {"b": "B", "band": "floor-8", "code": "B-PA", "path": "images/plans/apts/B-floor-8-B-PA.jpg"}, {"b": "B", "band": "floor-8", "code": "B-PB", "path": "images/plans/apts/B-floor-8-B-PB.jpg"}, {"b": "B", "band": "floor-9", "code": "B-PC", "path": "images/plans/apts/B-floor-9-B-PC.jpg"}, {"b": "C", "band": "floor-1", "code": "E", "path": "images/plans/apts/C-floor-1-E.jpg"}, {"b": "C", "band": "floor-1", "code": "D", "path": "images/plans/apts/C-floor-1-D.jpg"}, {"b": "C", "band": "floor-1", "code": "C1", "path": "images/plans/apts/C-floor-1-C1.jpg"}, {"b": "C", "band": "floor-1", "code": "A1", "path": "images/plans/apts/C-floor-1-A1.jpg"}, {"b": "C", "band": "floor-1", "code": "F1", "path": "images/plans/apts/C-floor-1-F1.jpg"}, {"b": "C", "band": "typical-2-12", "code": "E", "path": "images/plans/apts/C-typical-2-12-E.jpg"}, {"b": "C", "band": "typical-2-12", "code": "F", "path": "images/plans/apts/C-typical-2-12-F.jpg"}, {"b": "C", "band": "typical-2-12", "code": "D", "path": "images/plans/apts/C-typical-2-12-D.jpg"}, {"b": "C", "band": "typical-2-12", "code": "C", "path": "images/plans/apts/C-typical-2-12-C.jpg"}, {"b": "C", "band": "typical-2-12", "code": "B", "path": "images/plans/apts/C-typical-2-12-B.jpg"}, {"b": "C", "band": "typical-2-12", "code": "A", "path": "images/plans/apts/C-typical-2-12-A.jpg"}, {"b": "C", "band": "typical-13-19", "code": "G", "path": "images/plans/apts/C-typical-13-19-G.jpg"}, {"b": "C", "band": "typical-13-19", "code": "H", "path": "images/plans/apts/C-typical-13-19-H.jpg"}, {"b": "C", "band": "typical-13-19", "code": "I", "path": "images/plans/apts/C-typical-13-19-I.jpg"}, {"b": "C", "band": "typical-13-19", "code": "J", "path": "images/plans/apts/C-typical-13-19-J.jpg"}, {"b": "C", "band": "floor-20", "code": "C-PA", "path": "images/plans/apts/C-floor-20-C-PA.jpg"}, {"b": "C", "band": "floor-20", "code": "C-PB", "path": "images/plans/apts/C-floor-20-C-PB.jpg"}];
const img=document.getElementById('img'), ov=document.getElementById('ov');
const idxEl=document.getElementById('idx'), totalEl=document.getElementById('total'), labelEl=document.getElementById('label'), listEl=document.getElementById('list');
let i=0, pts=[], saved={};
totalEl.textContent=APTS.length;
function load(){ const a=APTS[i]; img.src=a.path; idxEl.textContent=i+1; labelEl.textContent=a.b+' · '+a.band+' · '+a.code; pts=(saved[key()]||[]).slice(); draw(); }
function key(){ const a=APTS[i]; return a.b+'|'+a.band+'|'+a.code; }
function draw(){ const w=img.clientWidth,h=img.clientHeight;
  let s='';
  if(pts.length){ s+='<polygon points="'+pts.map(p=>(p.x*w)+','+(p.y*h)).join(' ')+'" fill="rgba(25,118,210,0.20)" stroke="#1976d2" stroke-width="2"/>';
    pts.forEach(p=>{ s+='<circle cx="'+(p.x*w)+'" cy="'+(p.y*h)+'" r="4" fill="#e53935"/>'; }); }
  ov.innerHTML=s; }
img.addEventListener('click',e=>{ const r=img.getBoundingClientRect(); pts.push({x:(e.clientX-r.left)/img.clientWidth, y:(e.clientY-r.top)/img.clientHeight}); draw(); });
document.getElementById('undo').onclick=()=>{ pts.pop(); draw(); };
document.getElementById('clear').onclick=()=>{ pts=[]; draw(); };
document.getElementById('save').onclick=()=>{ if(pts.length>=3) saved[key()]=pts.slice(); renderList(); if(i<APTS.length-1){i++;load();} };
document.getElementById('next').onclick=()=>{ if(i<APTS.length-1){i++;load();} };
document.getElementById('prev').onclick=()=>{ if(i>0){i--;load();} };
window.addEventListener('resize',draw);
function renderList(){ const lines=[]; for(const a of APTS){ const k=a.b+'|'+a.band+'|'+a.code; if(saved[k]) lines.push('POLY|'+a.b+'|'+a.band+'|'+a.code+'|'+saved[k].map(p=>p.x.toFixed(4)+','+p.y.toFixed(4)).join(';')); }
  listEl.textContent=lines.join('\n')||'אין פוליגונים…'; }
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(listEl.textContent);
load();
</script></body></html>
